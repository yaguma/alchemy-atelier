[project]
name = "atelier-e2e-mcp"
version = "0.1.0"
description = "godot-ai MCPを使い、描画中のゲーム画面を操作・検証するローカル専用E2Eテスト（CI対象外）"
requires-python = ">=3.12"
# fastmcpはgodot-ai 4.3.1（.mcp.json・atelier/addons/godot_ai/と同じ版）が内部で使う版に揃える
dependencies = ["fastmcp==4.1.3"]

[project.scripts]
atelier-e2e = "atelier_e2e.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier_e2e"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
